<div class="container">
    <div class="content">
        <div class="card-container">
            <div class="card-back card">
                <div id="card-stripe"></div>
                <div id="card-cvc">XXX</div>
                <div id="card-cvc-label">CVC code</div>
            </div>
            <div class="card-front card">
                <div class="card-content">
                    <div class="bank-name">BANK</div>
                    <div class="card-number">${CardNumber}</div>
                    <div class="card-holder">${HolderName}</div>
                    <div class="exp-date">${ValidThru}</div>
                </div>
            </div>
        </div>
        <input name="nameBox" class="editor" />
        <input name="cardBox" class="editor" />
    </div>
    <div class="footer">
        <input name="btnAdd" class="button" />
    </div>
</div>
