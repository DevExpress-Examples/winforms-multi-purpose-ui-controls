<div class="frame" id="frame">
    <div id="content" class="content">
        <div class="card lower">
            <div class="stripe"></div>
            <div class="text-input cvv">
                <input class="input" name="cvcBox">
            </div>
            <div class="title cvv-text">CVC</div>
            <div class="button-container">
                <input class="button button-wide" name="btnAccept">
                <input class="button" name="btnDecline">
            </div>
        </div>
        <div class="card upper">
            <div class="title">${Title}</div>
            <div class="text-input digits">
                <input class="input" name="numberBox">
            </div>
            <div class="text-input holder">
                <input class="input" name="nameBox">
            </div>
            <div class="date-container">
                <div class="text-input month-year">
                    <input class="input" name="validThruMonthBox">
                </div>
                <div class="delimeter">/</div>
                <div class="text-input month-year">
                    <input class="input" name="validThruYearBox">
                </div>
            </div>
            <div class="title valid">VALID THRU</div>
        </div>
    </div>
</div>
